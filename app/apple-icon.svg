<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="text-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4e8"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0f20"/>
      <stop offset="100%" stop-color="#1a0d2e"/>
    </linearGradient>
    <mask id="text-mask">
      <rect width="180" height="180" fill="black"/>
      <text
        x="90"
        y="126"
        font-family="'Arial', 'Helvetica Neue', sans-serif"
        font-size="82"
        font-weight="800"
        letter-spacing="-3"
        text-anchor="middle"
        fill="white"
      >IZ</text>
    </mask>
  </defs>
  <!-- Dark navy background -->
  <rect width="180" height="180" rx="40" fill="url(#bg-grad)"/>
  <!-- Gradient text via filled rect masked by text shape -->
  <rect width="180" height="180" rx="40" fill="url(#text-grad)" mask="url(#text-mask)"/>
</svg>
